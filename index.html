<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light only">
<title>맞을래 맞힐래?</title>
<style>
  :root{ color-scheme: light only; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:#fdf3df;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif; }
  #app{ position:fixed; inset:0; display:flex; flex-direction:column; }
  /* 상단: 대치 씬 */
  #scene{ position:relative; flex:1 1 52%; min-height:44%; overflow:hidden;
    background:linear-gradient(#bfe3ff,#eaf7ff 60%,#d7f0c9); }
  #scene canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  #hud{ position:absolute; top:8px; left:0; right:0; display:flex; justify-content:space-between;
    padding:0 14px; font-weight:800; color:#4a3b1a; font-size:15px; pointer-events:none; text-shadow:0 1px 0 #fff8; }
  #hud .pill{ background:#fff8; border-radius:999px; padding:4px 12px; }
  #streakWrap{ position:absolute; top:40px; left:0; right:0; text-align:center; pointer-events:none; }
  /* 하단: 퀴즈 */
  #quiz{ flex:1 1 48%; background:#fff7e6; border-top:5px solid #f2c14e;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.2vh; padding:2vh 3vw 3vh; }
  #eq{ font-size:min(12vw,64px); font-weight:900; color:#3a2d12; letter-spacing:1px; display:flex; align-items:center; gap:2vw; }
  #eq .blank{ display:inline-flex; align-items:center; justify-content:center;
    min-width:1.7em; height:1.25em; border:4px dashed #e08a1e; border-radius:14px; color:#e08a1e; background:#fff; }
  #eq .op{ color:#d5622a; }
  #choices{ display:flex; gap:3vw; flex-wrap:wrap; justify-content:center; }
  .card{ cursor:pointer; border:none; background:linear-gradient(#ffffff,#ffe9b8);
    border:3px solid #eab54a; border-radius:18px; box-shadow:0 5px 0 #d69a2f, 0 8px 12px #0002;
    font-weight:900; color:#4a3410; font-size:min(11vw,52px); width:min(26vw,120px); height:min(26vw,120px);
    display:flex; align-items:center; justify-content:center; transition:transform .06s; touch-action:manipulation; }
  .card:active{ transform:translateY(4px); box-shadow:0 1px 0 #d69a2f, 0 3px 6px #0002; }
  .card.wrong{ animation:shake .3s; border-color:#e0563a; }
  .card.right{ border-color:#4bbe5a; background:linear-gradient(#eafff0,#bff3cc); }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
  #banner{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:min(16vw,120px); font-weight:900; pointer-events:none; opacity:0; }
  /* 시작/결과 오버레이 */
  .overlay{ position:fixed; inset:0; background:#000a; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; z-index:20; color:#fff; text-align:center; padding:24px; }
  .overlay h1{ font-size:min(13vw,60px); margin:0; color:#ffd766; text-shadow:0 3px 0 #a05a00; }
  .overlay p{ font-size:min(5vw,20px); margin:0; max-width:520px; line-height:1.6; }
  .bigbtn{ margin-top:8px; background:linear-gradient(#ffd35a,#f2a52e); color:#5a3200; border:none;
    font-weight:900; font-size:min(7vw,30px); padding:16px 40px; border-radius:999px; box-shadow:0 6px 0 #b96f10; cursor:pointer; }
  .bigbtn:active{ transform:translateY(4px); box-shadow:0 2px 0 #b96f10; }
  #muteBtn{ position:absolute; top:6px; right:50%; transform:translateX(50%); }
  .hidden{ display:none !important; }
  #rot小{ display:none; }
</style>
</head>
<body>
<div id="app">
  <div id="scene">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div class="pill" id="scorePill">점수 0</div>
      <div class="pill" id="roundPill">1 / 3</div>
    </div>
    <div id="banner"></div>
  </div>
  <div id="quiz">
    <div id="eq"></div>
    <div id="choices"></div>
  </div>
</div>

<div class="overlay" id="startOv">
  <h1>맞을래 맞힐래?</h1>
  <p>숫자 카드를 뽑아 빈칸(☐)에 들어갈 수를 골라요.<br>맞히면 안전! 틀리면 주먹이 날아와요 💥<br><b>정답을 맞힐래? 주먹에 맞을래?</b></p>
  <button class="bigbtn" id="startBtn">시작하기</button>
</div>

/* ---------- 오디오 (합성) ---------- */
let AC=null, master=null;
function audioInit(){
  if(AC) return;
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value=0.9; master.connect(AC.destination);
    try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  }catch(e){ AC=null; }
}
function resumeAudio(){ try{ if(AC && AC.state!=='running') AC.resume(); }catch(e){} }
let muted=false;
function tone(freq,dur,type,vol,slideTo){
  if(!AC||muted) return;
  try{
    const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(Math.max(1,freq),t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo),t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001,vol||0.3),t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
function noiseBurst(dur,vol){
  if(!AC||muted) return;
  try{
    const n=Math.floor(AC.sampleRate*dur), buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2); }
    const s=AC.createBufferSource(); s.buffer=buf;
    const g=AC.createGain(); g.gain.value=vol||0.5;
    const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1200;
    s.connect(f); f.connect(g); g.connect(master); s.start();
  }catch(e){}
}
function sndCorrect(){ tone(660,0.12,'triangle',0.35); setTimeout(()=>tone(990,0.16,'triangle',0.35),90); }
function sndRelief(){ tone(520,0.5,'sine',0.25,300); }
function sndPunch(){ noiseBurst(0.22,0.7); tone(120,0.2,'square',0.5,50); }
function sndShuffle(){ for(let i=0;i<5;i++) setTimeout(()=>tone(300+Math.random()*200,0.05,'square',0.12),i*60); }
function sndDraw(){ tone(440,0.1,'triangle',0.3,880); }

const G = {
  score:0, round:0, roundsPerCard:3,
  card:null, a:0,b:0,c:0, op:'+', hidePos:'b', answer:0, choices:[],
  fistX:0, fistTarget:0, fistVel:0, punching:false, kidFly:0, kidAngle:0, kidY:0,
  shake:0, state:'idle', // idle, drawing, quiz, resolving
  tension:0
};

/* ---------- 문제 생성 ---------- */
function rnd(n){ return Math.floor(Math.random()*n); }
function drawCardValue(){ return rnd(100); } // 0~99
function makeQuestion(cardC){
  // 카드 = C. A op B = C. op는 + 또는 -.
  let a,b,c=cardC,op,hide,answer;
  if(Math.random()<0.5 || c===0){
    // 덧셈: a + b = c  (a,b >=0, a+b=c)
    op='+'; a=rnd(c+1); b=c-a;
  }else{
    // 뺄셈: a - b = c  (a = c+b, a<=99)
    op='-'; const maxB=99-c; b=rnd(maxB+1); a=c+b;
  }
  hide = Math.random()<0.5 ? 'a' : 'b';
  answer = hide==='a' ? a : b;
  // 보기 3개: 정답 + 가까운 오답 2개(0~99, 중복없음)
  const set=new Set([answer]);
  let guard=0;
  while(set.size<3 && guard++<50){
    let off=(rnd(2)?1:-1)*(1+rnd(4));
    let cand=answer+off;
    if(cand<0) cand=answer+Math.abs(off);
    if(cand>99) cand=answer-Math.abs(off);
    if(cand>=0&&cand<=99) set.add(cand);
  }
  while(set.size<3){ let c2=rnd(100); set.add(c2); }
  const choices=[...set].sort(()=>Math.random()-0.5);
  return {a,b,c,op,hide,answer,choices};
}

/* ---------- 렌더 UI ---------- */
function renderEq(){
  const q=G;
  const A = q.hide==='a' ? '<span class="blank">?</span>' : q.a;
  const B = q.hide==='b' ? '<span class="blank">?</span>' : q.b;
  eqEl.innerHTML = `${A} <span class="op">${q.op}</span> ${B} <span class="op">=</span> ${q.c}`;
}
function renderChoices(){
  choicesEl.innerHTML='';
  G.choices.forEach(v=>{
    const b=document.createElement('button');
    b.className='card'; b.textContent=v;
    b.onclick=()=>onChoose(v,b);
    choicesEl.appendChild(b);
  });
}
function setHUD(){ scorePill.textContent='점수 '+G.score; roundPill.textContent=(G.round)+' / '+G.roundsPerCard; }
function showBanner(txt,color){
  banner.textContent=txt; banner.style.color=color||'#fff';
  banner.style.transition='none'; banner.style.opacity='1'; banner.style.transform='scale(0.6)';
  requestAnimationFrame(()=>{ banner.style.transition='all .5s cubic-bezier(.2,1.4,.4,1)'; banner.style.opacity='1'; banner.style.transform='scale(1)';
    setTimeout(()=>{ banner.style.transition='opacity .4s'; banner.style.opacity='0'; }, 650); });
}

/* ---------- 라운드 흐름 ---------- */
let drawAnim=0;
function newCard(){
  G.state='drawing'; choicesEl.innerHTML=''; eqEl.innerHTML='';
  G.round=0; setHUD();
  sndShuffle();
  drawAnim=0; G.card=drawCardValue();
  const dur=1100, t0=performance.now();
  (function step(){
    const t=performance.now()-t0; drawAnim=Math.min(1,t/dur);
    if(drawAnim<1){ requestAnimationFrame(step); }
    else { sndDraw(); setTimeout(nextRound, 250); }
  })();
}
function nextRound(){
  if(G.round>=G.roundsPerCard){ newCard(); return; }
  G.round++; setHUD();
  const q=makeQuestion(G.card);
  Object.assign(G,q);
  G.state='quiz';
  renderEq(); renderChoices();
}
function onChoose(v,btn){
  if(G.state!=='quiz') return;
  resumeAudio();
  if(v===G.answer){
    G.state='resolving'; btn.classList.add('right');
    G.score++; setHUD(); sndCorrect(); sndRelief();
    showBanner('휴~','#2e9c48');
    G.fistTarget = Math.min(0.35, G.tensionBase()+0.12); // 주먹 살짝 뒤로
    setTimeout(()=>{ nextRound(); }, 850);
  }else{
    G.state='resolving'; btn.classList.add('wrong');
    // 정답 카드 표시
    [...choicesEl.children].forEach(c=>{ if(+c.textContent===G.answer) c.classList.add('right'); });
    punch();
  }
}
function punch(){
  G.punching=true; G.fistPhase='pull'; G.fistX=0.0; // 0=대치, 1=가격
  sndPunch();
}

/* ---------- 캔버스 그리기 ---------- */
G.tensionBase=function(){ return 0.12; };
function drawFist(x, cx, cy, scale){
  // x: 0(대치)~1(가격). 화면 오른쪽에서 왼쪽으로.
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(scale,scale);
  ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.strokeStyle='#7a4a1e'; ctx.lineWidth=8;
  // 소매/팔뚝
  ctx.fillStyle='#e6552e';
  ctx.beginPath(); ctx.roundRect(60,-70,180,140,18); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#f0c9a0'; // 손목
  ctx.beginPath(); ctx.roundRect(20,-60,70,120,16); ctx.fill(); ctx.stroke();
  // 주먹 덩어리
  ctx.fillStyle='#ffd9ad';
  ctx.beginPath(); ctx.roundRect(-120,-90,160,180,40); ctx.fill(); ctx.stroke();
  // 손가락 마디
  ctx.lineWidth=6;
  for(let i=0;i<4;i++){ const yy=-70+i*45; ctx.beginPath(); ctx.moveTo(-120,yy); ctx.lineTo(-120,yy+40); ctx.stroke(); }
  ctx.beginPath(); ctx.arc(-90,20,26,0,7); ctx.stroke(); // 엄지 관절 느낌
  ctx.restore();
}
function drawKid(cx, cy, h, angle, alpha){
  if(!kidReady) return;
  const ar = kidImg.width/kidImg.height;
  const hh=h, ww=hh*ar;
  ctx.save();
  ctx.globalAlpha=alpha==null?1:alpha;
  ctx.translate(cx,cy); ctx.rotate(angle||0);
  ctx.drawImage(kidImg, -ww/2, -hh/2, ww, hh);
  ctx.restore();
}
function drawGround(){
  ctx.fillStyle='#cdeeb0'; ctx.fillRect(0,H*0.82,W,H*0.18);
  ctx.strokeStyle='#a9d98a'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(0,H*0.82); ctx.lineTo(W,H*0.82); ctx.stroke();
}
let particles=[];
function spawnImpact(x,y){
  for(let i=0;i<18;i++){ particles.push({x,y,vx:(Math.random()*2-1)*6,vy:(Math.random()*-1-0.3)*6-2,life:1,col:Math.random()<0.5?'#ffce54':'#ff6b57'}); }
}
function drawParticles(dt){
  for(const p of particles){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.5; p.life-=dt*2; }
  particles=particles.filter(p=>p.life>0);
  for(const p of particles){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,5,0,7); ctx.fill(); }
  ctx.globalAlpha=1;
}

/* 카드 뽑기 애니메이션 그리기 */
function drawDeck(cx,cy){
  const s=Math.min(W,H);
  const cw=s*0.16, ch=cw*1.4;
  // 흔들리는 덱
  for(let i=0;i<5;i++){
    const wob = G.state==='drawing'? Math.sin((performance.now()/90)+i)* (12*(1-drawAnim)) :0;
    ctx.save(); ctx.translate(cx-40+i*3+wob, cy+i*2); ctx.rotate((i-2)*0.02+wob*0.002);
    roundRectPath(-cw/2,-ch/2,cw,ch,10); ctx.fillStyle='#fff'; ctx.fill();
    ctx.lineWidth=3; ctx.strokeStyle='#e0a93a'; ctx.stroke(); ctx.restore();
  }
  // 뽑힌 카드가 위로 떠오르며 숫자 공개
  if(G.card!=null){
    const p=drawAnim;
    const yy=cy - 90*p;
    ctx.save(); ctx.translate(cx+70, yy); ctx.scale(1+0.3*p,1+0.3*p);
    roundRectPath(-cw/2,-ch/2,cw,ch,12); ctx.fillStyle='#fff8e6'; ctx.fill();
    ctx.lineWidth=4; ctx.strokeStyle='#f2a52e'; ctx.stroke();
    if(p>0.5){ ctx.fillStyle='#3a2d12'; ctx.font='900 '+(cw*0.62)+'px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.globalAlpha=(p-0.5)*2;
      ctx.fillText(G.card, 0, 0); ctx.globalAlpha=1; }
    ctx.restore();
  }
}
function roundRectPath(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }

/* ---------- 메인 루프 ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  ctx.clearRect(0,0,W,H);

  // 화면 흔들림
  let sx=0, sy=0;
  if(G.shake>0){ sx=(Math.random()*2-1)*G.shake; sy=(Math.random()*2-1)*G.shake; G.shake*=0.85; if(G.shake<0.4)G.shake=0; }
  ctx.save(); ctx.translate(sx,sy);

  drawGround();

  const cy=H*0.60;
  const kidBaseX=W*0.24;

  // 주먹 위치 계산
  const restFistX=W*0.80;               // 대치 시 주먹 위치
  const contactX=kidBaseX + W*0.10;      // 가격 지점
  let fistScreenX=restFistX;

  if(G.punching){
    if(G.fistPhase==='pull'){ G.fistX-=dt*2.2; if(G.fistX<=-0.5){ G.fistX=-0.5; G.fistPhase='hit'; } fistScreenX=restFistX + (-G.fistX)*W*0.10; }
    else if(G.fistPhase==='hit'){
      G.fistX+=dt*6.5;
      fistScreenX = restFistX + (-0.5)*W*0.10 - G.fistX*(restFistX-contactX+W*0.02);
      if(fistScreenX<=contactX && !G.hitDone){
        G.hitDone=true; G.kidFly=1; G.shake=22; spawnImpact(contactX-W*0.05, cy);
        showBanner('퍽!','#e0563a');
      }
      if(G.fistX>=1.1){ G.fistPhase='return'; }
    } else if(G.fistPhase==='return'){
      fistScreenX = restFistX; // 복귀
    }
  } else {
    // 대치: 미세 떨림
    const trem=Math.sin(now/70)*2.5;
    fistScreenX = restFistX + trem;
  }

  // 캐릭터
  if(G.kidFly>0){
    // 날아감: 왼쪽 위로 회전하며 튕김
    G.kidAngle -= dt*10; G.kidFly+=dt;
    const fx = kidBaseX - G.kidFly*W*0.5;
    const fy = cy - Math.sin(Math.min(Math.PI,G.kidFly*2))*H*0.4;
    drawKid(fx, fy, H*0.42, G.kidAngle, Math.max(0,1-G.kidFly*0.4));
    if(G.kidFly>1.6){
      // 복귀
      G.kidFly=0; G.kidAngle=0; G.hitDone=false; G.punching=false; G.fistPhase=null;
      showBanner('다시!','#e08a1e');
      setTimeout(()=>nextRound(), 500);
    }
  } else {
    const trem = G.punching?0:Math.sin(now/70)*3;
    // 버티는 자세: 약간 앞으로 기울임
    drawKid(kidBaseX+trem*0.5, cy, H*0.42, -0.05, 1);
  }

  // 주먹
  const fscale = Math.min(W,H)/700;
  drawFist(0, fistScreenX, cy, fscale*1.1);

  drawParticles(dt);

  // 카드 뽑기 연출
  if(G.state==='drawing'){ drawDeck(W*0.5, H*0.42); }

  ctx.restore();
  requestAnimationFrame(loop);
}

/* ---------- 시작 ---------- */
function startGame(){
  audioInit(); resumeAudio();
  startOv.classList.add('hidden');
  G.score=0; setHUD();
  resize();
  newCard();
}
document.getElementById('startBtn').onclick=startGame;

resize();
requestAnimationFrame(loop);
// 폰트/이미지 로딩과 무관하게 루프 시작
</script>
</body>
</html>
