<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light only">
<title>맞을래 맞힐래?</title>
<style>
  :root{ color-scheme: light only; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:#fdf3df;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif; }
  #app{ position:fixed; inset:0; display:flex; flex-direction:column; }
  #scene{ position:relative; flex:1 1 52%; min-height:44%; overflow:hidden;
    background:linear-gradient(#bfe3ff,#eaf7ff 60%,#d7f0c9); }
  #scene canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  #flash{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  #hud{ position:absolute; top:8px; left:0; right:0; display:flex; justify-content:space-between;
    padding:0 14px; font-weight:800; color:#4a3b1a; font-size:15px; pointer-events:none; text-shadow:0 1px 0 #fff8; }
  #hud .pill{ background:#fff8; border-radius:999px; padding:4px 12px; }
  #cap{ position:absolute; left:0; right:0; top:42px; text-align:center; pointer-events:none; opacity:0; z-index:3; }
  #cap .m{ font-weight:900; font-size:min(7.5vw,34px); text-shadow:0 2px 0 #fff, 0 0 6px #fff8; }
  #cap .s{ font-weight:800; font-size:min(4.6vw,19px); color:#5a3b1a; text-shadow:0 1px 0 #fff; margin-top:2px; }
  #quiz{ flex:1 1 48%; background:#fff7e6; border-top:5px solid #f2c14e;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.2vh; padding:2vh 3vw 3vh; }
  #eq{ font-size:min(12vw,64px); font-weight:900; color:#3a2d12; letter-spacing:1px; display:flex; align-items:center; gap:2vw; }
  #eq .blank{ display:inline-flex; align-items:center; justify-content:center;
    min-width:1.7em; height:1.25em; border:4px dashed #e08a1e; border-radius:14px; color:#e08a1e; background:#fff; }
  #eq .op{ color:#d5622a; }
  #choices{ display:flex; gap:3vw; flex-wrap:wrap; justify-content:center; }
  .card{ cursor:pointer; background:linear-gradient(#ffffff,#ffe9b8);
    border:3px solid #eab54a; border-radius:18px; box-shadow:0 5px 0 #d69a2f, 0 8px 12px #0002;
    font-weight:900; color:#4a3410; font-size:min(11vw,52px); width:min(26vw,120px); height:min(26vw,120px);
    display:flex; align-items:center; justify-content:center; transition:transform .06s; touch-action:manipulation; }
  .card:active{ transform:translateY(4px); box-shadow:0 1px 0 #d69a2f, 0 3px 6px #0002; }
  .card.wrong{ animation:shake .3s; border-color:#e0563a; }
  .card.right{ border-color:#4bbe5a; background:linear-gradient(#eafff0,#bff3cc); box-shadow:0 5px 0 #3fae4f, 0 8px 12px #0002; }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
  #banner{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:min(16vw,120px); font-weight:900; pointer-events:none; opacity:0; }
  .overlay{ position:fixed; inset:0; background:#000a; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; z-index:20; color:#fff; text-align:center; padding:24px; }
  .overlay h1{ font-size:min(13vw,60px); margin:0; color:#ffd766; text-shadow:0 3px 0 #a05a00; }
  .overlay p{ font-size:min(5vw,20px); margin:0; max-width:520px; line-height:1.6; }
  .bigbtn{ margin-top:8px; background:linear-gradient(#ffd35a,#f2a52e); color:#5a3200; border:none;
    font-weight:900; font-size:min(7vw,30px); padding:16px 40px; border-radius:999px; box-shadow:0 6px 0 #b96f10; cursor:pointer; }
  .bigbtn:active{ transform:translateY(4px); box-shadow:0 2px 0 #b96f10; }
  #diffGrid{ display:flex; flex-direction:column; gap:12px; width:min(86vw,360px); }
  .diffbtn{ display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:linear-gradient(#ffffff,#ffe6b0); color:#5a3200; border:3px solid #f2a52e; border-radius:16px;
    font-weight:900; font-size:min(6vw,24px); padding:14px 22px; box-shadow:0 5px 0 #c98418; cursor:pointer; }
  .diffbtn:active{ transform:translateY(3px); box-shadow:0 2px 0 #c98418; }
  .diffbtn small{ font-weight:700; font-size:0.62em; color:#9a6a1e; }
  .hidden{ display:none !important; }
</style>
</head>
<body>
<div id="app">
  <div id="scene">
    <canvas id="cv"></canvas>
    <div id="flash"></div>
    <div id="hud">
      <div class="pill" id="scorePill">점수 0</div>
      <div class="pill" id="roundPill">1 / 3</div>
    </div>
    <div id="cap"><div class="m"></div><div class="s"></div></div>
    <div id="banner"></div>
  </div>
  <div id="quiz">
    <div id="eq"></div>
    <div id="choices"></div>
  </div>
</div>

<div class="overlay" id="startOv">
  <h1>맞을래 맞힐래?</h1>
  <p>숫자 카드를 뽑아 빈칸(☐)에 들어갈 수를 골라요.<br>맞히면 안전! 틀리면 주먹이 날아와요 💥<br><b>정답을 맞힐래? 주먹에 맞을래?</b></p>
  <button class="bigbtn" id="startBtn">시작하기</button>
</div>

<div class="overlay hidden" id="diffOv">
  <h1>난이도 고르기</h1>
  <div id="diffGrid">
    <button class="diffbtn" data-max="9">쉬움 <small>0 ~ 9</small></button>
    <button class="diffbtn" data-max="20">보통 <small>0 ~ 20</small></button>
    <button class="diffbtn" data-max="50">어려움 <small>0 ~ 50</small></button>
    <button class="diffbtn" data-max="99">도전 <small>0 ~ 99</small></button>
  </div>
</div>

let AC=null,master=null,muted=false;
function audioInit(){ if(AC)return; try{ AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=0.95; master.connect(AC.destination);
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){} }catch(e){AC=null;} }
function resumeAudio(){ try{ if(AC&&AC.state!=='running')AC.resume(); }catch(e){} }
function tone(freq,dur,type,vol,slideTo){ if(!AC||muted)return; try{ const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(Math.max(1,freq),t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo),t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(0.0001,vol||0.3),t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02);}catch(e){} }
function noiseBurst(dur,vol,cut){ if(!AC||muted)return; try{ const n=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=AC.createBufferSource(); s.buffer=buf; const g=AC.createGain(); g.gain.value=vol||0.5;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||1200; s.connect(f); f.connect(g); g.connect(master); s.start();}catch(e){} }

const G={ score:0,round:0,roundsPerCard:3,maxN:20, char:'kid', card:null,a:0,b:0,c:0,op:'+',hide:'b',answer:0,choices:[],

function rnd(n){return Math.floor(Math.random()*n);}
function drawCardValue(){ let v=rnd(G.maxN+1); if(v===0)v=1+rnd(G.maxN); return v; }
function makeQuestion(card){ const M=G.maxN;
  // 난이도↑ = 가운데 추론(A□=C) 비율↑, 난이도↓ = 답 추론(AB=□) 비율↑
  const pMid = M<=9?0.0 : M<=20?0.30 : M<=50?0.60 : 0.85;
  let a,b,c,op,hide,answer;
  for(let tries=0;tries<14;tries++){
    if(Math.random()<pMid){
      c=card;
      if(Math.random()<0.5||c===0){ op='+'; a=rnd(c+1); b=c-a; }
      else { op='-'; const maxB=M-c; b=rnd(maxB+1); a=c+b; }
      hide=Math.random()<0.5?'a':'b'; answer=hide==='a'?a:b;
    } else {
      a=card;
      if(Math.random()<0.5||a===0){ op='+'; b=rnd(M-a+1); c=a+b; }
      else { op='-'; b=rnd(a+1); c=a-b; }
      hide='c'; answer=c;
    }
    // 0 빈도 줄이기: 정답이나 보이는 수가 0이면 대체로 재생성(가끔만 허용)
    const zeros=(answer===0)+(a===0)+(b===0);
    if(zeros===0 || Math.random()<0.04) break;
  }
  const set=new Set([answer]); let guard=0;
  while(set.size<3&&guard++<60){ let off=(rnd(2)?1:-1)*(1+rnd(4)); let v=answer+off;
    if(v<0)v=answer+Math.abs(off); if(v>M)v=answer-Math.abs(off); if(v>=0&&v<=M&&!(v===0&&Math.random()<0.85))set.add(v); }
  while(set.size<3){ let v=rnd(M+1); if(v===0)v=1+rnd(M); set.add(v); }
  return {a,b,c,op,hide,answer,choices:[...set].sort(()=>Math.random()-0.5)};
}

function drawPow(x,y,S,life){ try{ const p=Math.max(0,Math.min(1,life)); const s=S*0.52*(1.15-0.12*p); const n=12;

  ctx.strokeStyle='#a9d98a'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(0,H*0.82); ctx.lineTo(W,H*0.82); ctx.stroke(); }
function spawnImpact(x,y){ for(let i=0;i<34;i++){ const a=Math.random()*7, sp=3+Math.random()*11;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,col:['#ffce54','#ff6b57','#fff2b0','#ffa040'][rnd(4)],r:4+Math.random()*6,kind:Math.random()<0.3?'star':'dot'}); }
  rings.push({x,y,r:8,life:1}); rings.push({x,y,r:8,life:1,d:0.35}); }
function spawnHeart(x,y){ particles.push({x:x+(Math.random()*2-1)*40,y,vx:(Math.random()*2-1)*1.2,vy:-2-Math.random()*1.6,life:1,col:pick(['#ff7aa8','#ffd54a','#8bd66b']),r:9+Math.random()*5,kind:'heart'}); }
function spawnConfetti(x,y){ for(let i=0;i<3;i++) particles.push({x:x+(Math.random()*2-1)*W*0.09,y:y+(Math.random()*2-1)*30,vx:(Math.random()*2-1)*3,vy:-3-Math.random()*3,life:1,col:pick(['#ff7aa8','#ffd54a','#8bd66b','#5bc0ff','#c78bff','#ff9a52']),r:5+Math.random()*4,kind:'star'}); }
function drawFX(dt){
  for(const p of particles){ p.x+=p.vx; p.y+=p.vy; p.vy+= (p.kind==='heart'?0.02:0.4); p.life-=dt*(p.kind==='heart'?1.0:1.5); }
  particles=particles.filter(p=>p.life>0);
  for(const p of particles){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.col;
    if(p.kind==='star'){ starShape(p.x,p.y,p.r*1.4,p.r*0.6,5); }
    else if(p.kind==='heart'){ heartShape(p.x,p.y,p.r); }
    else { ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); } }
  ctx.globalAlpha=1;
  for(const r of rings){ if(r.d>0){ r.d-=dt; } else { r.r+=dt*560; r.life-=dt*1.7; } }
  rings=rings.filter(r=>r.life>0);
  for(const r of rings){ if(r.d>0)continue; ctx.globalAlpha=Math.max(0,r.life); ctx.strokeStyle='#fff'; ctx.lineWidth=7; ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,7); ctx.stroke(); }
  ctx.globalAlpha=1;
}
function starShape(cx,cy,ro,ri,n){ ctx.beginPath(); for(let i=0;i<n*2;i++){ const rr=i%2?ri:ro, a=Math.PI*i/n-Math.PI/2;
    const x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr; i?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.closePath(); ctx.fill(); }

  ctx.bezierCurveTo(cx-s*1.3,cy-s*0.2, cx-s*0.5,cy-s*1.1, cx,cy-s*0.35);
  ctx.bezierCurveTo(cx+s*0.5,cy-s*1.1, cx+s*1.3,cy-s*0.2, cx,cy+s*0.9); ctx.closePath(); ctx.fill(); }

function drawDeck(cx,cy){ const s=Math.min(W,H), cw=s*0.15, ch=cw*1.4, p=G.drawAnim, now=performance.now();
  const fan = p<0.55 ? (p/0.55) : p<0.75 ? (1-(p-0.55)/0.2) : 0;
  for(let i=0;i<7;i++){ const t=(i-3)/3, wob=Math.sin(now/70+i)*4*fan;
    ctx.save(); ctx.translate(cx + t*cw*1.15*fan + wob, cy + Math.abs(t)*10*fan); ctx.rotate(t*0.5*fan);
    roundRectPath(-cw/2,-ch/2,cw,ch,10); ctx.fillStyle='#fff'; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle='#e0a93a'; ctx.stroke();
    ctx.fillStyle='#f6d38a'; ctx.beginPath(); ctx.arc(0,0,cw*0.16,0,7); ctx.fill(); ctx.restore(); }
  if(G.card!=null && p>0.72){ const lp=(p-0.72)/0.28, yy=cy-120*lp, sc=1+0.45*lp;
    ctx.save(); ctx.translate(cx,yy); ctx.rotate(Math.sin(lp*6)*0.05*(1-lp)); ctx.scale(sc,sc);
    roundRectPath(-cw/2,-ch/2,cw,ch,12); ctx.fillStyle='#fff8e6'; ctx.fill(); ctx.lineWidth=4; ctx.strokeStyle='#f2a52e'; ctx.stroke();
    if(lp>0.35){ ctx.fillStyle='#3a2d12'; ctx.font='900 '+(cw*0.66)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.globalAlpha=Math.min(1,(lp-0.35)/0.4); ctx.fillText(G.card,0,0); ctx.globalAlpha=1; } ctx.restore(); } }

/* ---- loop ---- */
let last=performance.now(), heartT=0;
function frame(now){ let dt=Math.min(0.05,(now-last)/1000); last=now;
  ctx.clearRect(0,0,W,H);
  const frozen = G.hitStop>0; if(frozen) G.hitStop-=dt;
  let sx=0,sy=0; if(G.shake>0){ sx=(Math.random()*2-1)*G.shake; sy=(Math.random()*2-1)*G.shake; if(!frozen){ G.shake*=0.86; if(G.shake<0.4)G.shake=0; } }
  ctx.save(); ctx.translate(sx,sy);
  drawGround();
  const cy=H*0.58, kidBaseX=W*0.24, restFistX=W*1.25, contactX=W*0.48;
  let fistScreenX=restFistX, lunge=0;
  if(G.punching && !frozen){
    if(G.fistPhase==='pull'){ G.fistX-=dt*2.2; if(G.fistX<=-0.6){ G.fistX=-0.6; G.fistPhase='hit'; } fistScreenX=restFistX+(-G.fistX)*W*0.12; }
    else if(G.fistPhase==='hit'){ G.fistX+=dt*8.5; lunge=Math.min(1,G.fistX+0.6); fistScreenX=restFistX+(-0.6)*W*0.12-G.fistX*(restFistX-contactX+W*0.02);
      if(fistScreenX<=contactX && !G.hitDone){ G.hitDone=true; G.kidFly=0.0001; G.kidSquash=1; G.shake=36; G.hitStop=0.12; flashA=0.9;
        spawnImpact(contactX-W*0.04,cy); sndPunch(); G.pow=0.55; G.powX=contactX-W*0.02; G.powY=cy; }
      if(G.fistX>=1.15)G.fistPhase='return'; }
    else { fistScreenX=restFistX; }
  } else if(G.punching && frozen){ fistScreenX=restFistX+(-0.6)*W*0.12-G.fistX*(restFistX-contactX+W*0.02); lunge=1; }
  else { fistScreenX=restFistX+Math.sin(now/70)*2.5; }

  if(G.kidFly>0){
    if(!frozen){ G.kidAngle-=dt*10; G.kidFly+=dt; if(G.kidSquash>0)G.kidSquash=Math.max(0,G.kidSquash-dt*4); }
    const fx=kidBaseX-G.kidFly*W*0.55, fy=cy-Math.sin(Math.min(Math.PI,G.kidFly*2))*H*0.42, sq=G.kidSquash;
    drawChar(fx,fy,H*0.42,G.kidAngle,Math.max(0,1-G.kidFly*0.4),1+sq*0.4,1-sq*0.3);
    if(G.kidFly>1.6){ G.kidFly=0; G.kidAngle=0; G.hitDone=false; }
  } else {
    let drawX=kidBaseX, hop=0, sqx=1,sqy=1, tilt=-0.05;
    if(G.celebrate>0){ if(!frozen)G.celebrate-=dt; const ph=now/70;
      hop=-Math.abs(Math.sin(ph*1.7))*H*0.10;          // 신나게 폴짝폴짝
      drawX=kidBaseX+Math.sin(ph*0.9)*W*0.045;         // 좌우로 스텝
      tilt=0.30*Math.sin(ph*1.2);                      // 몸 흔들기
      sqx=1+0.10*Math.sin(ph*3.2); sqy=1-0.10*Math.sin(ph*3.2);
      if(!frozen){ heartT+=dt; if(heartT>0.07){ heartT=0; spawnHeart(drawX,cy-H*0.16); spawnConfetti(drawX,cy-H*0.22); } }
    } else { const trem=G.punching?0:Math.sin(now/70)*3; drawX=kidBaseX+trem*0.5; }
    drawChar(drawX,cy+hop,H*0.42,tilt,1,sqx,sqy);
  }

  if(G.punching) drawFist(fistScreenX,cy,1,lunge);
  drawFX(frozen?0:dt);
  if(G.state==='drawing') drawDeck(W*0.5,H*0.42);
  ctx.restore();

  if(flashA>0){ flashEl.style.opacity=flashA.toFixed(3); flashA-=dt*3.2; if(flashA<0)flashA=0; } else flashEl.style.opacity='0';
}
function loop(now){ try{ frame(now); }catch(e){ try{ctx.restore();}catch(_){} } requestAnimationFrame(loop); }

/* ---- flow ---- */
document.getElementById('startBtn').onclick=()=>{ audioInit(); resumeAudio(); startOv.classList.add('hidden'); diffOv.classList.remove('hidden'); };
[...document.querySelectorAll('.diffbtn')].forEach(b=>{ b.onclick=()=>{ audioInit(); resumeAudio(); G.maxN=+b.dataset.max;
  diffOv.classList.add('hidden'); G.score=0; setHUD(); resize(); newCard(); }; });
resize(); requestAnimationFrame(loop);
</script>
</body>
